<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>FastAPI on AWS EKS - High Level Project Flow</title>
  <desc>High-level professional flow diagram for a FastAPI service delivered to AWS EKS with Terraform, Docker, GitHub Actions, Kubernetes, observability, and alerting.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.48" stop-color="#F7F9F3"/>
      <stop offset="1" stop-color="#FFF4E5"/>
    </linearGradient>

    <linearGradient id="pipeline" x1="0" y1="0" x2="260" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>

    <linearGradient id="aws" x1="0" y1="0" x2="300" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#FCE8C9"/>
    </linearGradient>

    <linearGradient id="runtime" x1="0" y1="0" x2="300" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0FDF4"/>
      <stop offset="1" stop-color="#E7F7EC"/>
    </linearGradient>

    <linearGradient id="observe" x1="0" y1="0" x2="300" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E6F0F7"/>
    </linearGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" stroke="#DCE5EA" stroke-width="1" opacity="0.7"/>
      <circle cx="22" cy="22" r="1.2" fill="#C8D3DA" opacity="0.62"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>

    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>

    <style>
      .eyebrow {
        font: 800 14px 'Segoe UI', Arial, sans-serif;
        fill: #EA580C;
        letter-spacing: 0.12em;
      }

      .title {
        font: 800 46px 'Segoe UI', Arial, sans-serif;
        fill: #0F172A;
        letter-spacing: 0;
      }

      .subtitle {
        font: 500 20px 'Segoe UI', Arial, sans-serif;
        fill: #475569;
        letter-spacing: 0;
      }

      .card-title {
        font: 800 23px 'Segoe UI', Arial, sans-serif;
        fill: #0F172A;
        letter-spacing: 0;
      }

      .card-text {
        font: 500 16px 'Segoe UI', Arial, sans-serif;
        fill: #475569;
        letter-spacing: 0;
      }

      .chip {
        font: 800 13px 'Segoe UI', Arial, sans-serif;
        fill: #0F172A;
        letter-spacing: 0;
      }

      .footer {
        font: 700 15px 'Segoe UI', Arial, sans-serif;
        fill: #334155;
        letter-spacing: 0;
      }

      .flow-label {
        font: 800 13px 'Segoe UI', Arial, sans-serif;
        fill: #334155;
      }

      .arrow-blue {
        stroke: #2563EB;
        stroke-width: 3.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow-blue);
      }

      .arrow-orange {
        stroke: #F59E0B;
        stroke-width: 3.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow-orange);
      }

      .arrow-green {
        stroke: #16A34A;
        stroke-width: 3.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow-green);
      }

      .arrow-slate {
        stroke: #475569;
        stroke-width: 3.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow-slate);
      }

      .dashed {
        stroke-dasharray: 8 8;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#page)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.35"/>

  <g transform="translate(88 74)">
    <text x="0" y="0" class="eyebrow">CLOUD-NATIVE DELIVERY OVERVIEW</text>
    <text x="0" y="58" class="title">FastAPI on AWS EKS</text>
    <text x="0" y="94" class="subtitle">A production-style AWS flow: IaC, CI/CD, keyless auth, runtime security, observability and alerting.</text>
  </g>

  <g transform="translate(1038 72)">
    <rect width="424" height="138" rx="26" fill="#FFFFFF" stroke="#D7E1E8" filter="url(#shadow)"/>
    <text x="34" y="44" class="card-title">Technology stack</text>
    <rect x="34" y="68" width="82" height="28" rx="14" fill="#FED7AA"/>
    <text x="61" y="87" class="chip">AWS</text>
    <rect x="130" y="68" width="82" height="28" rx="14" fill="#DCFCE7"/>
    <text x="158" y="87" class="chip">EKS</text>
    <rect x="226" y="68" width="128" height="28" rx="14" fill="#FDE68A"/>
    <text x="254" y="87" class="chip">Terraform</text>
    <rect x="34" y="102" width="100" height="26" rx="13" fill="#E0F2FE"/>
    <text x="64" y="119" class="chip">Docker</text>
    <rect x="148" y="102" width="154" height="26" rx="13" fill="#F1F5F9"/>
    <text x="176" y="119" class="chip">GitHub Actions</text>
    <rect x="316" y="102" width="74" height="26" rx="13" fill="#FCE7F3"/>
    <text x="338" y="119" class="chip">K8s</text>
  </g>

  <!-- Main flow cards -->
  <g transform="translate(88 290)">
    <rect width="250" height="212" rx="28" fill="#FFFFFF" stroke="#D7E1E8" filter="url(#shadow)"/>
    <circle cx="42" cy="44" r="20" fill="#0F172A"/>
    <path d="M 34 44 L 42 52 L 52 36" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="50" class="card-title">Source Code</text>
    <text x="32" y="96" class="card-text">FastAPI quote API</text>
    <text x="32" y="124" class="card-text">Dockerfile and tests</text>
    <text x="32" y="152" class="card-text">Terraform and K8s manifests</text>
  </g>

  <g transform="translate(396 290)">
    <rect width="270" height="212" rx="28" fill="url(#pipeline)" stroke="#CFE0EF" filter="url(#shadow)"/>
    <circle cx="42" cy="44" r="20" fill="#2563EB"/>
    <path d="M 34 39 H 50 M 34 49 H 46" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <text x="76" y="50" class="card-title">CI/CD Pipeline</text>
    <text x="34" y="96" class="card-text">Validate app, IaC and YAML</text>
    <text x="34" y="124" class="card-text">Build and scan image</text>
    <text x="34" y="152" class="card-text">Assume AWS role via OIDC</text>
  </g>

  <g transform="translate(724 290)">
    <rect width="270" height="212" rx="28" fill="url(#aws)" stroke="#F2C38B" filter="url(#shadow)"/>
    <circle cx="42" cy="44" r="20" fill="#FF9900"/>
    <path d="M 29 47 C 37 58 50 58 59 47" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 31 35 H 55 M 31 35 V 49 M 55 35 V 49" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="50" class="card-title">AWS Platform</text>
    <text x="34" y="96" class="card-text">Terraform provisions AWS</text>
    <text x="34" y="124" class="card-text">VPC, ECR, EKS and logs</text>
    <text x="34" y="152" class="card-text">IAM OIDC + Access Entries</text>
  </g>

  <g transform="translate(1052 290)">
    <rect width="270" height="212" rx="28" fill="url(#runtime)" stroke="#C2E5C9" filter="url(#shadow)"/>
    <circle cx="42" cy="44" r="20" fill="#16A34A"/>
    <path d="M 42 31 L 55 39 V 54 L 42 62 L 29 54 V 39 L 42 31 Z" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <path d="M 42 31 V 45 L 55 39 M 42 45 L 29 39" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="50" class="card-title">EKS Runtime</text>
    <text x="34" y="96" class="card-text">AWS ELB via ingress-nginx</text>
    <text x="34" y="124" class="card-text">Service routes to FastAPI pods</text>
    <text x="34" y="152" class="card-text">HPA, PDB and NetworkPolicy</text>
  </g>

  <g transform="translate(1178 602)">
    <rect width="344" height="196" rx="28" fill="url(#observe)" stroke="#C7D8E5" filter="url(#shadow)"/>
    <circle cx="42" cy="44" r="20" fill="#475569"/>
    <path d="M 33 53 C 36 43 39 39 43 44 C 48 51 51 39 56 35" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="76" y="50" class="card-title">Observability &amp; Alerts</text>
    <text x="34" y="88" class="card-text">Prometheus scrapes /metrics</text>
    <text x="34" y="116" class="card-text">Grafana visualizes traffic and latency</text>
    <text x="34" y="144" class="card-text">Alertmanager sends email alerts</text>
    <text x="34" y="172" class="card-text">EKS control plane logs in CloudWatch</text>
  </g>

  <!-- Flow arrows -->
  <path d="M 338 396 C 360 396, 374 396, 396 396" class="arrow-blue"/>
  <text x="348" y="374" class="flow-label">commit</text>

  <path d="M 666 396 C 688 396, 702 396, 724 396" class="arrow-blue"/>
  <text x="648" y="374" class="flow-label">OIDC + image</text>

  <path d="M 994 396 C 1016 396, 1030 396, 1052 396" class="arrow-green"/>
  <text x="1014" y="374" class="flow-label">deploy</text>

  <path d="M 1220 502 C 1220 552, 1242 580, 1284 602" class="arrow-slate dashed"/>
  <text x="1244" y="558" class="flow-label">metrics + logs</text>

  <!-- Supporting platform ribbon -->
  <g transform="translate(88 626)">
    <rect width="938" height="146" rx="28" fill="#FFFFFF" stroke="#D7E1E8" filter="url(#shadow)"/>
    <text x="34" y="48" class="card-title">What this project demonstrates</text>
    <text x="34" y="84" class="card-text">A complete DevOps/Cloud workflow around a real API workload, from source code to observable AWS EKS runtime.</text>

    <rect x="34" y="106" width="96" height="28" rx="14" fill="#FED7AA"/>
    <text x="64" y="125" class="chip">IaC</text>
    <rect x="144" y="106" width="106" height="28" rx="14" fill="#DCFCE7"/>
    <text x="172" y="125" class="chip">CI/CD</text>
    <rect x="264" y="106" width="96" height="28" rx="14" fill="#DBEAFE"/>
    <text x="294" y="125" class="chip">OIDC</text>
    <rect x="374" y="106" width="90" height="28" rx="14" fill="#FDE68A"/>
    <text x="404" y="125" class="chip">ECR</text>
    <rect x="478" y="106" width="90" height="28" rx="14" fill="#E0F2FE"/>
    <text x="506" y="125" class="chip">EKS</text>
    <rect x="582" y="106" width="116" height="28" rx="14" fill="#F1F5F9"/>
    <text x="608" y="125" class="chip">Security</text>
    <rect x="712" y="106" width="168" height="28" rx="14" fill="#FCE7F3"/>
    <text x="728" y="125" class="chip">Monitoring + Alerts</text>
  </g>

  <g transform="translate(88 820)">
    <rect width="1434" height="42" rx="21" fill="#FFFFFF" stroke="#D7E1E8"/>
    <text x="302" y="27" class="footer">Outcome: a containerized FastAPI service deployed to AWS EKS with keyless delivery, security gates, monitoring and alerting.</text>
  </g>
</svg>
