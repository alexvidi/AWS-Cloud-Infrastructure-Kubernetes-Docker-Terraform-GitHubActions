# -----------------------------------------------------------------------------
# GitHub Actions Workflow: Build, Scan, and Deploy to EKS
#
# Goal:
# - Build the FastAPI Docker image and push to ECR using OIDC (no access keys).
# - Scan the container image with Trivy (fail on HIGH/CRITICAL).
# - Ensure the ingress-nginx controller exists in EKS.
# - Deploy to EKS using raw Kubernetes manifests (kubectl apply) and set the
#   image tag to the validated commit SHA.
#
# Triggers:
# - Completion of the Validate workflow on master.
# - Only proceeds when Validate finishes successfully.
# - Builds and deploys only when the validated commit changes application
#   runtime files or Kubernetes manifests.
# -----------------------------------------------------------------------------

name: Deploy

on:
  # Manual trigger for on-demand deploys (first deploy, redeploy, demos).
  workflow_dispatch:

  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: ["master"]

env:
  IMAGE_NAME: market-quote-api
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  K8S_NAMESPACE: market-quote
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  # -----------------------------------------------------------------------------
  # JOB 0: DETECT WHETHER THIS COMMIT REQUIRES AN APPLICATION DEPLOYMENT
  # -----------------------------------------------------------------------------
  changes:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Detect Deploy-Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      deploy_required: ${{ steps.filter.outputs.deploy_required }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}
          fetch-depth: 2

      - name: Detect changed files
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          # A manual dispatch is an explicit request to deploy the current ref.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: forcing deploy."
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If GitHub does not provide the parent commit in history, prefer
          # deploying rather than accidentally skipping a real runtime change.
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "No parent commit available. Requiring deploy by default."
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only HEAD^ HEAD)"
          echo "Changed files:"
          echo "$changed_files"

          deploy_required=false

          # Only rebuild and redeploy when the validated commit changes the
          # runtime image inputs or the raw Kubernetes manifests.
          while IFS= read -r file; do
            case "$file" in
              k8s/*)
                deploy_required=true
                break
                ;;
              app/tests/*|app/requirements-dev.txt)
                ;;
              app/main.py|app/__init__.py|app/requirements.txt|app/Dockerfile|app/.dockerignore)
                deploy_required=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "deploy_required=$deploy_required" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------------
  # JOB 1: BUILD, SCAN, AND PUSH IMAGE
  # -----------------------------------------------------------------------------
  build_and_push:
    if: ${{ needs.changes.outputs.deploy_required == 'true' }}
    needs: changes
    name: Build, Scan, and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build once (load locally) for Trivy scan, using cache.
      - name: Build Image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.69.3
          cache: true

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: "1"
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Upload Trivy Report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      # Push after a clean scan.
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------------------
  # JOB 2: DEPLOY TO EKS WITH RAW MANIFESTS
  # -----------------------------------------------------------------------------
  deploy:
    if: ${{ needs.changes.outputs.deploy_required == 'true' }}
    name: Deploy to EKS (manifests)
    runs-on: ubuntu-latest
    needs: [changes, build_and_push]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Ensure ingress-nginx controller is installed
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/cloud/deploy.yaml
          kubectl rollout status -n ingress-nginx deployment/ingress-nginx-controller --timeout=180s

      - name: Apply namespaces first
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/monitoring-namespace.yaml

      - name: Create Grafana admin secret
        env:
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          if [ -z "$GRAFANA_ADMIN_USER" ] || [ -z "$GRAFANA_ADMIN_PASSWORD" ]; then
            echo "Missing GRAFANA_ADMIN_USER or GRAFANA_ADMIN_PASSWORD GitHub secret."
            exit 1
          fi

          kubectl create secret generic grafana-admin \
            --namespace monitoring \
            --from-literal=admin-user="$GRAFANA_ADMIN_USER" \
            --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Alertmanager SMTP secret
        env:
          ALERTMANAGER_SMTP_PASSWORD: ${{ secrets.ALERTMANAGER_SMTP_PASSWORD }}
        run: |
          if [ -z "$ALERTMANAGER_SMTP_PASSWORD" ]; then
            echo "Missing ALERTMANAGER_SMTP_PASSWORD GitHub secret."
            exit 1
          fi

          kubectl create secret generic alertmanager-smtp \
            --namespace monitoring \
            --from-literal=smtp-password="$ALERTMANAGER_SMTP_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Restart monitoring deployments after config updates
        run: |
          kubectl rollout restart -n monitoring deployment/prometheus-server deployment/alertmanager
          kubectl rollout status -n monitoring deployment/prometheus-server --timeout=180s
          kubectl rollout status -n monitoring deployment/alertmanager --timeout=180s

      - name: Update deployment image to validated commit
        run: |
          kubectl set image -n ${{ env.K8S_NAMESPACE }} deployment/market-quote-api market-quote-container=${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status -n ${{ env.K8S_NAMESPACE }} deployment/market-quote-api --timeout=180s

      # -----------------------------------------------------------------------------
      # POST-DEPLOY SMOKE TEST
      #
      # Goal:
      # - Verify that the Kubernetes Service has ready endpoints after rollout.
      # - Validate the application from inside the cluster network path.
      # - Confirm both the operational endpoint (/health) and the main API
      #   endpoint (/quote) respond with the expected payload.
      # -----------------------------------------------------------------------------
      - name: Smoke test application
        run: |
          set -euo pipefail

          # Ensure the Service already routes to ready Pods before testing.
          ENDPOINTS=$(kubectl get endpoints market-quote-service -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.subsets[*].addresses[*].ip}')
          if [ -z "$ENDPOINTS" ]; then
            echo "Service has no ready endpoints."
            kubectl get endpoints market-quote-service -n ${{ env.K8S_NAMESPACE }} -o yaml
            exit 1
          fi

          # Forward the in-cluster Service to localhost so the workflow can
          # exercise the app without depending on public ingress or DNS.
          kubectl port-forward -n ${{ env.K8S_NAMESPACE }} svc/market-quote-service 18080:80 >/tmp/port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" >/dev/null 2>&1 || true' EXIT

          # Retry the health check briefly while the port-forward becomes ready.
          for attempt in {1..10}; do
            if curl -fsS http://127.0.0.1:18080/health > health.json; then
              break
            fi

            if [ "$attempt" -eq 10 ]; then
              echo "Smoke test could not reach /health after rollout."
              cat /tmp/port-forward.log || true
              exit 1
            fi

            sleep 2
          done

          # Validate the main API endpoint after the basic health check passes.
          curl -fsS "http://127.0.0.1:18080/quote?symbol=BTC" > quote.json

          # Assert that both responses keep the expected API contract.
          python3 - <<'PY'
          from datetime import datetime
          import json

          with open("health.json", "r", encoding="utf-8") as f:
              health = json.load(f)
          assert health == {"status": "ok"}, health

          with open("quote.json", "r", encoding="utf-8") as f:
              quote = json.load(f)
          assert quote["symbol"] == "BTC", quote
          assert quote["currency"] == "USD", quote
          assert isinstance(quote["price"], int), quote
          assert quote["price"] > 0, quote
          assert quote["source"] == "synthetic", quote
          assert datetime.fromisoformat(quote["generated_at"]).tzinfo is not None, quote
          PY

      # -----------------------------------------------------------------------------
      # FAILURE DIAGNOSTICS
      #
      # Goal:
      # - Surface the most useful deployment state when the smoke test fails.
      # - Keep debugging lightweight and immediately visible in GitHub Actions.
      # -----------------------------------------------------------------------------
      - name: Debug deployment state on failure
        if: failure()
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}
          kubectl describe deployment -n ${{ env.K8S_NAMESPACE }} market-quote-api
          kubectl logs -n ${{ env.K8S_NAMESPACE }} deployment/market-quote-api --tail=100

  no_deploy_needed:
    if: ${{ needs.changes.outputs.deploy_required != 'true' }}
    needs: changes
    name: No Deploy Needed
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: echo "No deploy-relevant changes detected. Skipping build and deploy."
